[general]
live_config_reload = true
import = [ "./themes/themes/nord.toml" ]

[window]
title = "Alacritty@CachyOS"
decorations = "Full"  # None | Full
startup_mode = "Windowed"  # "Windowed" | "Maximized" | "Fullscreen"
dimensions = { columns = 156, lines = 42 }
# opacity = 0.7
resize_increments = true

[window.class]
instance = "Alacritty"
general = "Alacritty"

[font]
normal = { family = "Moralerspace Argon HW", style = "Regular" }
size = 18.0

[selection]
save_to_clipboard = true

[cursor]
unfocused_hollow = false
thickness = 0.3

[terminal.shell]
program = "/usr/bin/fish"

[mouse]
hide_when_typing = true

[colors]
# Whether or not `window.opacity` applies to all cell backgrounds, or only to the default background.
# When set to true all cells will be transparent regardless of their background color.
# transparent_background_colors = true
